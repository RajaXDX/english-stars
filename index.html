<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نجمات الإنجليزي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a sticker-book. Units are colored stickers in a wrapping grid; every activity plays on one centered "play card". */
:root{
  --bg:#FFF4F7; --paper:#FFFFFF; --ink:#3A2240; --muted:#85678B; --line:#F0D9E3;
  --rose:#D63F74; --rose-soft:#FCE2EC; --sun:#EFA41A; --sun-soft:#FFF1D2;
  --good:#23977A; --good-soft:#DAF3EA; --bad:#D1443A; --bad-soft:#FBE2DE;
  --c1:#E0507F; --t1:#FDE5EE; --c2:#E9793A; --t2:#FDEBDD; --c3:#9150C4; --t3:#F1E5FA;
  --c4:#1F9A7C; --t4:#DCF4EC; --c5:#3378C9; --t5:#E0EDFB;
  --shadow:0 2px 0 var(--line);
  --font-ar:'Baloo Bhaijaan 2', Tahoma, 'Segoe UI', sans-serif;
  --font-en:'Fredoka', 'Baloo Bhaijaan 2', 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1D1320; --paper:#291C2E; --ink:#F9E9F1; --muted:#BFA2C4; --line:#3D2B43;
  --rose:#F2709C; --rose-soft:#43233A; --sun:#F6C04F; --sun-soft:#3E3020;
  --good:#4FCDA9; --good-soft:#1C3A32; --bad:#F17A6F; --bad-soft:#47231F;
  --c1:#F2709C; --t1:#3F2333; --c2:#F59A62; --t2:#3F2A1E; --c3:#B987E6; --t3:#33254A;
  --c4:#4FCDA9; --t4:#1B3530; --c5:#6FA6EA; --t5:#1D2C42; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1D1320; --paper:#291C2E; --ink:#F9E9F1; --muted:#BFA2C4; --line:#3D2B43;
  --rose:#F2709C; --rose-soft:#43233A; --sun:#F6C04F; --sun-soft:#3E3020;
  --good:#4FCDA9; --good-soft:#1C3A32; --bad:#F17A6F; --bad-soft:#47231F;
  --c1:#F2709C; --t1:#3F2333; --c2:#F59A62; --t2:#3F2A1E; --c3:#B987E6; --t3:#33254A;
  --c4:#4FCDA9; --t4:#1B3530; --c5:#6FA6EA; --t5:#1D2C42; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--font-ar); font-size:17px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 48px}
.wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.en{font-family:var(--font-en); direction:ltr; unicode-bidi:isolate}
h1,h2,h3{margin:0; line-height:1.25; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible{outline:3px solid var(--rose); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.logo{width:52px; height:52px; border-radius:16px; background:var(--rose); display:grid; place-items:center; flex:none}
.logo svg{width:32px; height:32px}
.brand h1{font-size:1.7rem; font-weight:800}
.brand p{margin:0; color:var(--muted); font-size:.92rem}
.total{display:flex; align-items:center; gap:8px; background:var(--sun-soft); color:var(--ink); padding:6px 14px; border-radius:999px; font-weight:700}
.star{color:var(--sun)}

/* hello strip */
.hello{background:var(--paper); border:2px solid var(--line); border-radius:22px; padding:18px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:space-between}
.hello h2{font-size:1.35rem}
.hello p{margin:2px 0 0; color:var(--muted)}
.namebox{display:flex; gap:8px; flex-wrap:wrap}
.namebox input{font:inherit; padding:8px 14px; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); min-width:0; width:190px}
.btn{border:none; border-radius:14px; padding:9px 18px; font-weight:700; background:var(--rose); color:#fff}
.btn.ghost{background:var(--rose-soft); color:var(--rose)}
.btn:disabled{opacity:.45; cursor:default}

/* units grid */
.part-label{display:flex; align-items:baseline; gap:10px; font-weight:800; font-size:1.15rem}
.part-label small{color:var(--muted); font-weight:500; font-size:.9rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px}
.unit{position:relative; text-align:start; border:2px solid transparent; background:var(--t); border-radius:22px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:6px; transition:transform .15s}
.unit:hover{transform:translateY(-3px) rotate(-.6deg); border-color:var(--c)}
.unit .num{width:40px; height:40px; border-radius:12px; background:var(--c); color:#fff; display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:1.2rem}
.unit .pic{position:absolute; top:12px; left:14px; font-size:2rem; line-height:1}
.unit h3{font-family:var(--font-en); font-size:1.2rem; color:var(--c); text-align:left; direction:ltr}
.unit .ar{font-weight:700; font-size:1.05rem}
.unit .stars{font-size:1rem; letter-spacing:2px; color:var(--line)}
.unit .stars b{color:var(--sun); font-weight:400}
.unit.big{grid-column:1/-1; flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap}

/* unit screen */
.bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.back{border:none; background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:6px 14px; font-weight:700}
.uhead{background:var(--t); border-radius:24px; padding:18px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.uhead .num{width:56px; height:56px; border-radius:16px; background:var(--c); color:#fff; display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:1.6rem; flex:none}
.uhead h2{font-family:var(--font-en); color:var(--c); font-size:1.6rem; direction:ltr; text-align:right}
.uhead p{margin:0; font-weight:700}
.tabs{display:flex; gap:8px; flex-wrap:wrap}
.tab{border:2px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 16px; font-weight:700; display:flex; align-items:center; gap:6px}
.tab[aria-selected="true"]{background:var(--c); border-color:var(--c); color:#fff}
.tab .mini{font-size:.8rem; color:var(--sun)}
.tab[aria-selected="true"] .mini{color:#fff}

/* word cards */
.hint{color:var(--muted); margin:0}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px}
.card{background:var(--paper); border:2px solid var(--line); border-radius:20px; padding:14px 10px 12px; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center}
.card:hover{border-color:var(--c)}
.card.playing{border-color:var(--c); background:var(--t)}
.card .e{font-size:2.6rem; line-height:1.2}
.card .w{font-family:var(--font-en); font-weight:600; font-size:1.2rem; direction:ltr}
.card .m{color:var(--muted); font-size:.95rem}
.hide-ar .card .m{visibility:hidden}
.tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between}

/* grammar */
.gblock{background:var(--paper); border:2px solid var(--line); border-radius:22px; padding:18px 20px; display:flex; flex-direction:column; gap:12px}
.gblock h3{font-size:1.25rem; color:var(--c)}
.gblock p{margin:0; max-width:65ch}
.gtable{overflow-x:auto}
.gtable table{border-collapse:collapse; min-width:100%}
.gtable td, .gtable th{border:2px solid var(--line); padding:6px 12px; text-align:center}
.gtable th{background:var(--t); font-weight:700}
.gtable td.en, .gtable th.en{font-size:1.05rem}
.ex{display:flex; flex-direction:column; gap:8px}
.exrow{display:flex; align-items:center; gap:10px; background:var(--t); border-radius:14px; padding:8px 12px; flex-wrap:wrap}
.exrow .en{font-size:1.1rem; font-weight:500; flex:1 1 220px; text-align:left; min-width:0}
.exrow .tr{color:var(--muted); font-size:.95rem; flex:1 1 160px; min-width:0}
.say{flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--c); color:#fff; display:grid; place-items:center}
.say svg{width:20px; height:20px}

/* play card */
.play{background:var(--paper); border:2px solid var(--line); border-radius:26px; padding:22px 20px; display:flex; flex-direction:column; gap:18px; align-items:center; text-align:center}
.prog{width:100%; display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
.prog .track{flex:1; height:12px; background:var(--t); border-radius:999px; overflow:hidden}
.prog .fill{height:100%; background:var(--c); border-radius:999px; transition:width .3s}
.q-ask{font-size:1.1rem; font-weight:700}
.q-pic{font-size:5rem; line-height:1.1}
.q-word{font-family:var(--font-en); font-size:2.2rem; font-weight:700; color:var(--c); direction:ltr}
.bigsay{width:96px; height:96px; border-radius:50%; border:none; background:var(--c); color:#fff; display:grid; place-items:center; box-shadow:0 6px 0 var(--t)}
.bigsay svg{width:46px; height:46px}
.opts{width:100%; max-width:560px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.opt{border:2px solid var(--line); background:var(--bg); border-radius:18px; padding:12px 10px; font-weight:700; font-size:1.15rem; min-height:64px; transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--c); transform:translateY(-2px)}
.opt.en{font-family:var(--font-en); font-weight:600; font-size:1.25rem}
.opt.emo{font-size:2.6rem; line-height:1.1}
.opt.right{background:var(--good-soft); border-color:var(--good); color:var(--good)}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{min-height:1.6em; font-weight:800; font-size:1.15rem}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}

.sentence{font-family:var(--font-en); font-size:1.45rem; font-weight:500; direction:ltr; max-width:30ch; line-height:1.5}
.blank{display:inline-block; min-width:90px; border-bottom:3px dashed var(--c); color:var(--c); font-weight:700; padding:0 6px}
.opts.three{grid-template-columns:repeat(3, minmax(0,1fr))}

/* spelling */
.slots{display:flex; gap:6px; direction:ltr; flex-wrap:wrap; justify-content:center}
.slot{width:44px; height:52px; border-radius:12px; border:2px dashed var(--c); display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:1.6rem; background:var(--t)}
.slot.full{border-style:solid; background:var(--paper)}
.slots.ok .slot{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.slots.no{animation:shake .35s}
.tiles{display:flex; gap:8px; direction:ltr; flex-wrap:wrap; justify-content:center; max-width:560px}
.tile{width:50px; height:54px; border-radius:14px; border:none; background:var(--c); color:#fff; font-family:var(--font-en); font-weight:700; font-size:1.6rem; box-shadow:0 4px 0 var(--t)}
.tile:disabled{opacity:.2; cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* result */
.result h2{font-size:1.8rem}
.result .bigstars{font-size:3.2rem; letter-spacing:6px; color:var(--line)}
.result .bigstars b{color:var(--sun); font-weight:400}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

.toast{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:14px; font-weight:700; z-index:9; max-width:calc(100% - 32px); text-align:center}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:8; width:100%; height:100%}
.foot{color:var(--muted); font-size:.85rem; text-align:center}

@media (max-width:520px){
  .opts{gap:8px}
  .opts.three{grid-template-columns:1fr}
  .q-pic{font-size:4rem}
  .sentence{font-size:1.25rem}
  .slot{width:36px; height:46px; font-size:1.35rem}
  .tile{width:44px; height:48px; font-size:1.4rem}
  .cards{grid-template-columns:repeat(2, minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>

    ["grandparents","الجد والجدة","👴👵"],["chatty","كثيرة الكلام","🗣️"],["helpful","متعاونة","🤝"],["kind","لطيفة","💗"],
    ["lazy","كسولة","🥱"],["strong","قوية","💪"],["weak","ضعيفة","🥀"],["tired","متعبة","😴"],["shy","خجولة","🙈"]

  ],
  grammar:[
    { t:"المضارع البسيط والمضارع المستمر",

const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const unitById = id => UNITS.find(u=>u.id===id);

const SCORED = ["wquiz","spell","gquiz"];

/* storage (per-viewer convenience; page works without it) */
let store = {name:"", stars:{}};
try{ const s = JSON.parse(localStorage.getItem("nujoom-v1")||"null"); if(s) store = Object.assign(store, s); }catch(e){}
const save = () => { try{ localStorage.setItem("nujoom-v1", JSON.stringify(store)); }catch(e){} };
const getStars = (uid, act) => (store.stars[uid]||{})[act]||0;
const unitStars = uid => SCORED.reduce((n,a)=>n+getStars(uid,a),0);
function setStars(uid, act, n){ store.stars[uid] = store.stars[uid]||{}; if(n > (store.stars[uid][act]||0)){ store.stars[uid][act]=n; save(); } updateTotal(); }
function updateTotal(){ let t=0; for(const u in store.stars) for(const a in store.stars[u]) t+=store.stars[u][a]; $("#totalStars").textContent=t; }
const starsHtml = (n,max) => "<b>"+"★".repeat(n)+"</b>"+"★".repeat(Math.max(0,max-n));

/* speech */
let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref = ["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Zira","Female","Karen","Moira","Tessa"];
  voice = vs.find(v=>pref.some(p=>v.name.includes(p))) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate){
  if(!("speechSynthesis" in window)){ toast("الصوت غير متاح في هذا المتصفح"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/___/g,""));
  u.lang = "en-US"; u.rate = rate||0.85; u.pitch = 1.1; if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* sound effects */
let actx=null;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [659,880] : [300,220];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001, actx.currentTime+i*.12); g.gain.exponentialRampToValueAtTime(.18, actx.currentTime+i*.12+.02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+i*.12+.2); o.connect(g).connect(actx.destination); o.start(actx.currentTime+i*.12); o.stop(actx.currentTime+i*.12+.22); });
  }catch(e){}
}
let toastT;
function toast(msg){ let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2200); }

/* confetti */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#confetti"), ctx=cv.getContext("2d"); cv.hidden=false; cv.width=innerWidth; cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement); const cols=["--c1","--c2","--c3","--c4","--c5","--sun"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, r:Math.random()*6, s:5+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], star:Math.random()<.3}));
  let f=0; (function draw(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.star){ ctx.font=(p.s*2.4)+"px sans-serif"; ctx.fillText("★",0,0);} else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(++f<170) requestAnimationFrame(draw); else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden=true; } })();
}

/* ======= HOME ======= */
function renderHome(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  const name = store.name;
  const card = u => `<button class="unit" style="--c:var(--c${u.c});--t:var(--t${u.c})" data-unit="${u.id}">
      <span class="pic" aria-hidden="true">${u.pic}</span>
      <span class="num">${u.num}</span>
      <h3>${u.en}</h3><span class="ar">${u.ar}</span>
      <span class="stars" aria-label="${unitStars(u.id)} من 9 نجمات">${starsHtml(unitStars(u.id),9)}</span></button>`;
  app.innerHTML = `<div class="wrap" style="gap:22px">
    <section class="hello">
      <div><h2>${name ? "أهلاً يا "+esc(name)+"! 🌸" : "أهلاً يا بطلة! 🌸"}</h2>
      <p>اختاري وحدة، تعلّمي كلماتها وقاعدتها، ثم اجمعي النجوم في التحديات. كل وحدة فيها ٩ نجمات.</p></div>
      <form class="namebox" id="nameForm">
        <label for="nameIn" hidden>اسمك</label>
        <input id="nameIn" placeholder="اكتبي اسمك هنا" value="${esc(name)}" maxlength="20" autocomplete="off">
        <button class="btn" type="submit">${name ? "تغيير" : "حفظ"}</button>
      </form>
    </section>
    <div class="part-label">الجزء الأول <small>Part 1</small></div>
    <div class="grid">${UNITS.filter(u=>u.part===1).map(card).join("")}</div>
    <div class="part-label">الجزء الثاني <small>Part 2</small></div>
    <div class="grid">${UNITS.filter(u=>u.part===2).map(card).join("")}
      <button class="unit big" style="--c:var(--rose);--t:var(--sun-soft)" data-unit="all">
        <div style="display:flex;flex-direction:column;gap:4px"><h3 style="text-align:right">The Big Challenge</h3><span class="ar">التحدي الكبير: كلمات من كل الوحدات</span></div>
        <span class="stars">${starsHtml(getStars("all","wquiz"),3)}</span></button>
    </div></div>`;
  app.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{ if(b.dataset.unit==="all") startBig(); else openUnit(b.dataset.unit, "words"); });
  $("#nameForm").onsubmit = e => { e.preventDefault(); store.name = $("#nameIn").value.trim(); save(); renderHome(); toast(store.name ? "أهلاً يا "+store.name+"!" : "تم"); };
  setHash("");
}
function setHash(h){ try{ history.replaceState(null,"", h ? "#"+h : location.pathname+location.search); }catch(e){} }

/* ======= UNIT ======= */
let cur = null;
function openUnit(id, tab){
  const u = unitById(id); if(!u) return renderHome();
  cur = {u, tab};
  setHash(u.id);
  const tabs = Object.keys(ACT).map(k=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-tab="${k}">${ACT[k]}${SCORED.includes(k)?` <span class="mini">${"★".repeat(getStars(u.id,k))}</span>`:""}</button>`).join("");
  app.innerHTML = `<div class="wrap" style="--c:var(--c${u.c});--t:var(--t${u.c})">
    <div class="bar"><button class="back" id="back">→ كل الوحدات</button></div>
    <section class="uhead"><span class="num">${u.num}</span><div style="min-width:0"><h2>${u.en}</h2><p>${u.ar}</p></div></section>
    <nav class="tabs" role="tablist">${tabs}</nav>
    <section id="pane"></section></div>`;
  $("#back").onclick = renderHome;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>openUnit(u.id, b.dataset.tab));
  ({words:paneWords, grammar:paneGrammar, wquiz:()=>startWordQuiz(u), spell:()=>startSpell(u), gquiz:()=>startGrammarQuiz(u)})[tab](u);
  window.scrollTo({top:0});
}
function paneWords(u){
  const p = $("#pane");
  p.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="tools"><p class="hint">اضغطي على البطاقة لتسمعي الكلمة. جرّبي إخفاء المعنى واختبري نفسك.</p>
      <div class="row"><button class="btn ghost" id="toggleAr">إخفاء المعنى</button><button class="btn" id="playAll">اسمعي الكل</button></div></div>
    <div class="cards" id="cards">${u.words.map((w,i)=>`<button class="card" data-i="${i}"><span class="e" aria-hidden="true">${w[2]}</span><span class="w">${esc(w[0])}</span><span class="m">${w[1]}</span></button>`).join("")}</div></div>`;
  const cards = $("#cards");
  cards.querySelectorAll(".card").forEach(c=>c.onclick=()=>{ cards.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing")); c.classList.add("playing"); say(u.words[c.dataset.i][0], .8); });
  $("#toggleAr").onclick = e => { const h = cards.classList.toggle("hide-ar"); e.target.textContent = h ? "إظهار المعنى" : "إخفاء المعنى"; };
  let playing = null;
  $("#playAll").onclick = e => {
    if(playing){ clearTimeout(playing); playing=null; speechSynthesis.cancel(); e.target.textContent="اسمعي الكل"; return; }
    e.target.textContent="إيقاف"; let i=0;
    const step = () => { const els=cards.querySelectorAll(".card"); els.forEach(x=>x.classList.remove("playing"));
      if(i>=u.words.length || !document.body.contains(cards)){ playing=null; e.target.textContent="اسمعي الكل"; return; }
      els[i].classList.add("playing"); els[i].scrollIntoView({block:"nearest", behavior:"smooth"}); say(u.words[i][0], .8); i++; playing=setTimeout(step, 1700); };
    step();
  };
}
function paneGrammar(u){
  $("#pane").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${u.grammar.map(g=>{
    let table = "";
    if(g.table){ const en=g.table.en||[]; table = `<div class="gtable"><table><thead><tr>${g.table.head.map((h,i)=>`<th${en.includes(i)&&/[a-z]/i.test(h)?' class="en"':''}>${h}</th>`).join("")}</tr></thead><tbody>${
      g.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td${en.includes(i)?' class="en"':''}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
    return `<article class="gblock"><h3>${g.t}</h3><p>${g.p}</p>${table}
      <div class="ex">${g.ex.map(x=>`<div class="exrow"><button class="say" data-say="${esc(x[0])}" aria-label="استمعي">${SPK}</button><span class="en">${esc(x[0])}</span><span class="tr">${x[1]}</span></div>`).join("")}</div></article>`;
  }).join("")}
  <div class="row"><button class="btn" id="goQuiz">جاهزة؟ ابدئي تحدي القواعد</button></div></div>`;
  $("#pane").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say, .8));
  $("#goQuiz").onclick = () => openUnit(u.id, "gquiz");
}

/* ======= generic quiz runner ======= */
function runQuiz({uid, act, qs, render, onDone}){
  let i=0, score=0;
  const pane = $("#pane");
  function show(){
    if(i>=qs.length) return finish();
    pane.innerHTML = `<div class="play"><div class="prog"><span>${i+1} / ${qs.length}</span><div class="track"><div class="fill" style="width:${(i/qs.length)*100}%"></div></div><span class="star">★ ${score}</span></div><div id="qbody" style="display:contents"></div></div>`;
    render(qs[i], $("#qbody"), ok => { if(ok) score++; beep(ok); setTimeout(()=>{ i++; show(); }, ok ? 1100 : 2000); });
  }
  function finish(){
    const pct = score/qs.length, st = pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
    setStars(uid, act, st);
    const msg = st===3 ? "ممتاز! أنتِ نجمة" : st===2 ? "رائع! أحسنتِ" : st===1 ? "جيد! حاولي مرة ثانية لتحصلي على نجوم أكثر" : "لا بأس، راجعي الكلمات وحاولي من جديد";
    pane.innerHTML = `<div class="play result"><h2>${msg}${store.name? "، "+esc(store.name):""}</h2>
      <div class="bigstars" aria-label="${st} من 3 نجمات">${starsHtml(st,3)}</div>
      <p style="margin:0;font-weight:700">أجبتِ صح على ${score} من ${qs.length}</p>
      <div class="row"><button class="btn" id="again">العبي مرة ثانية</button><button class="btn ghost" id="toHome">كل الوحدات</button></div></div>`;
    $("#again").onclick = onDone.again; $("#toHome").onclick = renderHome;
    if(st===3) confetti(); beep(st>=2);
    // refresh tab stars
    const tb = document.querySelector(`[data-tab="${act}"] .mini`); if(tb) tb.textContent = "★".repeat(getStars(uid,act));
  }
  show();
}

/* word quiz: picture → word, listen → picture, word → meaning */
function makeWordQs(pool, n){
  const picked = shuffle(pool).slice(0, n);
  return picked.map((w,k)=>{
    const others = shuffle(pool.filter(x=>x[0]!==w[0] && x[2]!==w[2])).slice(0,3);
    return {type:["pic","listen","meaning"][k%3], w, opts:shuffle([w,...others])};
  });
}
function renderWordQ(q, box, done){
  const w=q.w; let head="", cls="";
  if(q.type==="pic"){ head=`<div class="q-ask">ما اسم هذه الصورة بالإنجليزي؟</div><div class="q-pic" aria-hidden="true">${w[2]}</div><div class="hint">${w[1]}</div>`; cls="en"; }
  if(q.type==="listen"){ head=`<div class="q-ask">استمعي واختاري الصورة الصحيحة</div><button class="bigsay" id="hear" aria-label="استمعي للكلمة">${SPK}</button>`; cls="emo"; }
  if(q.type==="meaning"){ head=`<div class="q-ask">ما معنى هذه الكلمة؟</div><div class="q-word">${esc(w[0])}</div>`; cls=""; }
  const label = o => q.type==="pic" ? esc(o[0]) : q.type==="listen" ? o[2] : o[1];
  box.innerHTML = head + `<div class="opts">${q.opts.map((o,j)=>`<button class="opt ${cls}" data-j="${j}">${label(o)}</button>`).join("")}</div><div class="feedback" aria-live="polite"></div>`;
  if(q.type!=="pic") { setTimeout(()=>say(w[0]), 250); }
  const h = box.querySelector("#hear"); if(h) h.onclick=()=>say(w[0]);
  const qw = box.querySelector(".q-word"); if(qw){ qw.style.cursor="pointer"; qw.onclick=()=>say(w[0]); }
  answerButtons(box, j=>q.opts[j][0]===w[0], q.opts.findIndex(o=>o[0]===w[0]), ok=>{ if(q.type==="pic" || ok) say(w[0]); done(ok); }, w[0]);
}
function answerButtons(box, isRight, rightIdx, done, rightText){
  const btns = box.querySelectorAll(".opt"), fb = box.querySelector(".feedback");
  btns.forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j, ok=isRight(j);
    btns.forEach(x=>x.disabled=true);
    b.classList.add(ok?"right":"wrong"); btns[rightIdx].classList.add("right");
    fb.className = "feedback "+(ok?"ok":"no");
    fb.innerHTML = ok ? shuffle(["أحسنتِ! ✨","صح! رائعة","ممتاز!","برافو!"])[0] : `الإجابة الصحيحة: <span class="en">${esc(rightText)}</span>`;
    done(ok);
  });
}
function startWordQuiz(u){
  runQuiz({uid:u.id, act:"wquiz", qs:makeWordQs(u.words, Math.min(10,u.words.length)), render:renderWordQ, onDone:{again:()=>openUnit(u.id,"wquiz")}});
}
function startBig(){
  cur = null; setHash("big");
  app.innerHTML = `<div class="wrap" style="--c:var(--rose);--t:var(--rose-soft)">
    <div class="bar"><button class="back" id="back">→ كل الوحدات</button></div>
    <section class="uhead"><span class="num">★</span><div><h2>The Big Challenge</h2><p>التحدي الكبير: ١٥ سؤالاً من كل الوحدات</p></div></section>
    <section id="pane"></section></div>`;
  $("#back").onclick = renderHome;
  const all = UNITS.flatMap(u=>u.words);
  runQuiz({uid:"all", act:"wquiz", qs:makeWordQs(all, 15), render:renderWordQ, onDone:{again:startBig}});
}

/* grammar quiz */
function startGrammarQuiz(u){
  const qs = shuffle(u.quiz).map(q=>({s:q[0], right:q[1], opts:shuffle(q.slice(1))}));
  runQuiz({uid:u.id, act:"gquiz", qs, onDone:{again:()=>openUnit(u.id,"gquiz")}, render:(q, box, done)=>{
    const parts = q.s.split("___");
    box.innerHTML = `<div class="q-ask">اختاري الكلمة المناسبة للفراغ</div>
      <div class="sentence">${esc(parts[0])}<span class="blank">&nbsp;</span>${esc(parts[1]||"")}</div>
      <div class="opts three">${q.opts.map((o,j)=>`<button class="opt en" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="feedback" aria-live="polite"></div>`;
    answerButtons(box, j=>q.opts[j]===q.right, q.opts.indexOf(q.right), ok=>{
      box.querySelector(".blank").textContent = q.right;
      say(q.s.replace("___", q.right).replace(/\(.*?\)/g,""), .85); done(ok);
    }, q.right);
  }});
}

/* spelling */
function startSpell(u){
  const pool = u.words.filter(w=>/^[a-z]{3,9}$/i.test(w[0]));
  const qs = shuffle(pool).slice(0, 6);
  runQuiz({uid:u.id, act:"spell", qs, onDone:{again:()=>openUnit(u.id,"spell")}, render:(w, box, done)=>{
    const word = w[0], target = word.toLowerCase();
    let letters = target.split(""), mix;
    do { mix = shuffle(letters); } while(mix.join("")===target && new Set(letters).size>1);
    let typed=[], tries=0, over=false;
    box.innerHTML = `<div class="q-ask">رتّبي الحروف لتكتبي الكلمة</div>
      <div class="q-pic" aria-hidden="true" style="font-size:4rem">${w[2]}</div>
      <div class="row" style="align-items:center"><span style="font-weight:700">${w[1]}</span><button class="say" id="hear" style="--c:var(--c)" aria-label="استمعي">${SPK}</button></div>
      <div class="slots" id="slots">${letters.map(()=>`<span class="slot"></span>`).join("")}</div>
      <div class="tiles" id="tiles">${mix.map((l,j)=>`<button class="tile" data-j="${j}">${l}</button>`).join("")}</div>
      <div class="row"><button class="btn ghost" id="undo">مسح حرف</button><button class="btn ghost" id="hint">ساعديني</button></div>
      <div class="feedback" aria-live="polite"></div>`;
    const slots=box.querySelector("#slots"), tiles=[...box.querySelectorAll(".tile")], fb=box.querySelector(".feedback");
    box.querySelector("#hear").onclick=()=>say(word);
    setTimeout(()=>say(word), 250);
    const paint = () => slots.querySelectorAll(".slot").forEach((s,k)=>{ s.textContent = typed[k]!=null ? mix[typed[k]] : ""; s.classList.toggle("full", typed[k]!=null); });
    function check(){
      const guess = typed.map(j=>mix[j]).join("");
      if(guess===target){ over=true; slots.classList.add("ok"); fb.className="feedback ok"; fb.textContent = tries===0 ? "ممتاز! من أول مرة" : "أحسنتِ!"; say(word); tiles.forEach(t=>t.disabled=true); done(tries<2); return; }
      tries++; slots.classList.remove("no"); void slots.offsetWidth; slots.classList.add("no"); beep(false);
      if(tries>=3){ over=true; fb.className="feedback no"; fb.innerHTML=`الكلمة هي: <span class="en">${esc(word)}</span>`; slots.querySelectorAll(".slot").forEach((s,k)=>{s.textContent=target[k]; s.classList.add("full");}); tiles.forEach(t=>t.disabled=true); say(word); done(false); return; }
      fb.className="feedback no"; fb.textContent = "قريبة! حاولي مرة ثانية"; typed=[]; tiles.forEach(t=>t.disabled=false); paint();
    }
    tiles.forEach(t=>t.onclick=()=>{ if(over) return; typed.push(+t.dataset.j); t.disabled=true; paint(); if(typed.length===letters.length) check(); });
    box.querySelector("#undo").onclick=()=>{ if(over||!typed.length) return; tiles[typed.pop()].disabled=false; paint(); };
    box.querySelector("#hint").onclick=()=>{ if(over) return;
      // place the next correct letter
      typed.forEach(j=>tiles[j].disabled=false); const keep=[];
      for(let k=0;k<letters.length;k++){ if(mix[typed[k]]===target[k]) keep.push(typed[k]); else break; }
      const k = keep.length; if(k>=letters.length) return;
      const j = mix.findIndex((l,idx)=>l===target[k] && !keep.includes(idx)); keep.push(j);
      typed = keep; typed.forEach(x=>tiles[x].disabled=true); tries = Math.max(tries,1); paint(); say(word);
      if(typed.length===letters.length) check(); };
  }});
}

/* ======= boot ======= */
updateTotal();
const h = (location.hash||"").slice(1);
if(h==="big") startBig(); else if(unitById(h)) openUnit(h,"words"); else renderHome();
</script>
