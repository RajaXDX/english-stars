<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نجوم الإنجليزي</title>
<meta name="description" content="موقع تفاعلي لتعلّم الإنجليزي وفق المنهج السعودي، من الصف الأول الابتدائي إلى الثالث الثانوي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a sticker-book. Grades and units are colored stickers in wrapping grids; every activity plays on one centered "play card". */
:root{
  --bg:#F6F7FB; --paper:#FFFFFF; --ink:#24263A; --muted:#6C7090; --line:#E1E4EF;
  --brand:#2B6FD6; --brand-soft:#E3EDFC; --sun:#EFA41A; --sun-soft:#FFF1D2;
  --good:#23977A; --good-soft:#DAF3EA; --bad:#D1443A; --bad-soft:#FBE2DE;
  --c1:#E0507F; --t1:#FDE5EE; --c2:#E9793A; --t2:#FDEBDD; --c3:#8A4FC4; --t3:#F0E5FA;
  --c4:#1F9A7C; --t4:#DCF4EC; --c5:#2F74C9; --t5:#E0EDFB;
  --font-ar:'Baloo Bhaijaan 2', Tahoma, 'Segoe UI', sans-serif;
  --font-en:'Fredoka', 'Baloo Bhaijaan 2', 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151724; --paper:#1F2233; --ink:#EEF0FA; --muted:#A3A8C6; --line:#30344A;
  --brand:#6FA2F0; --brand-soft:#1E2B45; --sun:#F6C04F; --sun-soft:#3A3020;
  --good:#4FCDA9; --good-soft:#1C3A32; --bad:#F17A6F; --bad-soft:#47231F;
  --c1:#F2709C; --t1:#3B2232; --c2:#F59A62; --t2:#3B291D; --c3:#B987E6; --t3:#30254A;
  --c4:#4FCDA9; --t4:#1B3530; --c5:#6FA6EA; --t5:#1D2C42; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151724; --paper:#1F2233; --ink:#EEF0FA; --muted:#A3A8C6; --line:#30344A;
  --brand:#6FA2F0; --brand-soft:#1E2B45; --sun:#F6C04F; --sun-soft:#3A3020;
  --good:#4FCDA9; --good-soft:#1C3A32; --bad:#F17A6F; --bad-soft:#47231F;
  --c1:#F2709C; --t1:#3B2232; --c2:#F59A62; --t2:#3B291D; --c3:#B987E6; --t3:#30254A;
  --c4:#4FCDA9; --t4:#1B3530; --c5:#6FA6EA; --t5:#1D2C42; color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ar); font-size:17px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 48px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.en{font-family:var(--font-en); direction:ltr; unicode-bidi:isolate}
h1,h2,h3{margin:0; line-height:1.25; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible{outline:3px solid var(--brand); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; background:none; border:none; padding:0; text-align:start}
.logo{width:52px; height:52px; border-radius:16px; background:var(--brand); display:grid; place-items:center; flex:none}
.logo svg{width:32px; height:32px}
.brand h1{font-size:1.7rem; font-weight:800}
.brand p{margin:0; color:var(--muted); font-size:.92rem}
.total{display:flex; align-items:center; gap:8px; background:var(--sun-soft); padding:6px 14px; border-radius:999px; font-weight:700}
.star{color:var(--sun)}

/* hello strip */
.hello{background:var(--paper); border:2px solid var(--line); border-radius:22px; padding:18px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:space-between}
.hello h2{font-size:1.35rem}
.hello p{margin:2px 0 0; color:var(--muted)}
.hello > div{min-width:0; flex:1 1 280px}
.namebox{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.namebox input{font:inherit; padding:8px 14px; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); min-width:0; width:170px}
.seg{display:inline-flex; background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:3px; gap:3px}
.seg button{border:none; background:none; border-radius:10px; padding:5px 14px; font-weight:700; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand); color:#fff}
.btn{border:none; border-radius:14px; padding:9px 18px; font-weight:700; background:var(--brand); color:#fff}
.btn.ghost{background:var(--brand-soft); color:var(--brand)}
.btn:disabled{opacity:.45; cursor:default}

/* gender gate */
.gate{background:var(--paper); border:2px solid var(--line); border-radius:26px; padding:28px 20px; display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center}
.gate h2{font-size:1.6rem}
.gate p{margin:0; color:var(--muted)}
.gate .pick{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}
.gate .pick button{width:160px; border:2px solid var(--line); background:var(--bg); border-radius:22px; padding:18px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:800; font-size:1.2rem}
.gate .pick button span{font-size:3rem; line-height:1}
.gate .pick button:hover{border-color:var(--brand)}

/* grids */
.part-label{display:flex; align-items:baseline; gap:10px; font-weight:800; font-size:1.15rem; flex-wrap:wrap}
.part-label small{color:var(--muted); font-weight:500; font-size:.9rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px}
.grid.grades{grid-template-columns:repeat(auto-fill, minmax(150px,1fr))}
.unit{position:relative; text-align:start; border:2px solid transparent; background:var(--t); border-radius:22px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:6px; transition:transform .15s}
.unit:hover{transform:translateY(-3px) rotate(-.6deg); border-color:var(--c)}
.unit .num{width:40px; height:40px; border-radius:12px; background:var(--c); color:#fff; display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:1.2rem}
.unit .pic{position:absolute; top:12px; left:14px; font-size:2rem; line-height:1}
.unit h3{font-family:var(--font-en); font-size:1.2rem; color:var(--c); text-align:left; direction:ltr}
.unit .ar{font-weight:700; font-size:1.05rem}
.unit .stars{font-size:1rem; letter-spacing:2px; color:var(--line)}
.unit .stars b{color:var(--sun); font-weight:400}
.unit .sub{color:var(--muted); font-size:.85rem}
.unit.big{grid-column:1/-1; flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap}
.grade .num{width:48px; height:48px; font-size:1.5rem}
.grade .ar{font-size:1.1rem}
.badge{display:inline-block; font-size:.75rem; font-weight:700; color:var(--c); background:var(--paper); border-radius:999px; padding:0 10px; align-self:flex-start}

/* unit screen */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.back{background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:6px 14px; font-weight:700}
.crumb{color:var(--muted); font-weight:700}
.uhead{background:var(--t); border-radius:24px; padding:18px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.uhead .num{width:56px; height:56px; border-radius:16px; background:var(--c); color:#fff; display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:1.6rem; flex:none}
.uhead h2{font-family:var(--font-en); color:var(--c); font-size:1.6rem; direction:ltr; text-align:right}
.uhead h2.arh{font-family:var(--font-ar); direction:rtl}
.uhead p{margin:0; font-weight:700}
.tabs{display:flex; gap:8px; flex-wrap:wrap}
.tab{border:2px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 16px; font-weight:700; display:flex; align-items:center; gap:6px}
.tab[aria-selected="true"]{background:var(--c); border-color:var(--c); color:#fff}
.tab .mini{font-size:.8rem; color:var(--sun)}
.tab[aria-selected="true"] .mini{color:#fff}

/* word cards */
.hint{color:var(--muted); margin:0}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px}
.card{background:var(--paper); border:2px solid var(--line); border-radius:20px; padding:14px 10px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; min-width:0}
.card:hover{border-color:var(--c)}
.card.playing{border-color:var(--c); background:var(--t)}
.card .e{font-size:2.6rem; line-height:1.2}
.card .w{font-family:var(--font-en); font-weight:600; font-size:1.2rem; direction:ltr; overflow-wrap:anywhere}
.card.noe .w{font-size:1.35rem; color:var(--c)}
.card .m{color:var(--muted); font-size:.95rem}
.hide-ar .card .m{visibility:hidden}
.tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between}

/* grammar */
.gblock{background:var(--paper); border:2px solid var(--line); border-radius:22px; padding:18px 20px; display:flex; flex-direction:column; gap:12px}
.gblock h3{font-size:1.25rem; color:var(--c)}
.gblock p{margin:0; max-width:65ch}
.gtable{overflow-x:auto}
.gtable table{border-collapse:collapse; min-width:100%}
.gtable td, .gtable th{border:2px solid var(--line); padding:6px 12px; text-align:center}
.gtable th{background:var(--t); font-weight:700}
.gtable td.en{font-size:1.05rem}
.ex{display:flex; flex-direction:column; gap:8px}
.exrow{display:flex; align-items:center; gap:10px; background:var(--t); border-radius:14px; padding:8px 12px; flex-wrap:wrap}
.exrow .en{font-size:1.1rem; font-weight:500; flex:1 1 220px; text-align:left; min-width:0}
.exrow .tr{color:var(--muted); font-size:.95rem; flex:1 1 160px; min-width:0}
.say{flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--c); color:#fff; display:grid; place-items:center}
.say svg{width:20px; height:20px}

/* play card */
.play{background:var(--paper); border:2px solid var(--line); border-radius:26px; padding:22px 20px; display:flex; flex-direction:column; gap:18px; align-items:center; text-align:center}
.prog{width:100%; display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
.prog .track{flex:1; height:12px; background:var(--t); border-radius:999px; overflow:hidden}
.prog .fill{height:100%; background:var(--c); border-radius:999px; transition:width .3s}
.q-ask{font-size:1.1rem; font-weight:700}
.q-pic{font-size:5rem; line-height:1.1}
.q-word{font-family:var(--font-en); font-size:2.2rem; font-weight:700; color:var(--c); direction:ltr; overflow-wrap:anywhere}
.q-ar{font-size:2rem; font-weight:800; color:var(--c)}
.bigsay{width:96px; height:96px; border-radius:50%; border:none; background:var(--c); color:#fff; display:grid; place-items:center; box-shadow:0 6px 0 var(--t)}
.bigsay svg{width:46px; height:46px}
.opts{width:100%; max-width:560px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.opt{border:2px solid var(--line); background:var(--bg); border-radius:18px; padding:12px 10px; font-weight:700; font-size:1.15rem; min-height:64px; transition:transform .1s; overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--c); transform:translateY(-2px)}
.opt.en{font-family:var(--font-en); font-weight:600; font-size:1.2rem}
.opt.emo{font-size:2.6rem; line-height:1.1}
.opt.right{background:var(--good-soft); border-color:var(--good); color:var(--good)}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{min-height:1.6em; font-weight:800; font-size:1.15rem}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.sentence{font-family:var(--font-en); font-size:1.45rem; font-weight:500; direction:ltr; max-width:34ch; line-height:1.5}
.blank{display:inline-block; min-width:90px; border-bottom:3px dashed var(--c); color:var(--c); font-weight:700; padding:0 6px}
.opts.three{grid-template-columns:repeat(3, minmax(0,1fr))}

/* spelling */
.slots{display:flex; gap:6px; direction:ltr; flex-wrap:wrap; justify-content:center; row-gap:10px}
.slots .gap{width:14px}
.slot{width:44px; height:52px; border-radius:12px; border:2px dashed var(--c); display:grid; place-items:center; font-family:var(--font-en); font-weight:700; font-size:1.6rem; background:var(--t)}
.slot.full{border-style:solid; background:var(--paper)}
.slots.ok .slot{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.slots.no{animation:shake .35s}
.tiles{display:flex; gap:8px; direction:ltr; flex-wrap:wrap; justify-content:center; max-width:600px}
.tile{width:50px; height:54px; border-radius:14px; border:none; background:var(--c); color:#fff; font-family:var(--font-en); font-weight:700; font-size:1.6rem; box-shadow:0 4px 0 var(--t)}
.tile:disabled{opacity:.2; cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* result */
.result h2{font-size:1.8rem}
.result .bigstars{font-size:3.2rem; letter-spacing:6px; color:var(--line)}
.result .bigstars b{color:var(--sun); font-weight:400}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

.toast{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:14px; font-weight:700; z-index:9; max-width:calc(100% - 32px); text-align:center}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:8; width:100%; height:100%}
.foot{color:var(--muted); font-size:.85rem; text-align:center; margin:0}

@media (max-width:520px){
  .opts{gap:8px}
  .opts.three{grid-template-columns:1fr}
  .q-pic{font-size:4rem}
  .sentence{font-size:1.25rem}
  .slot{width:34px; height:44px; font-size:1.3rem}
  .tile{width:42px; height:46px; font-size:1.35rem}
  .cards{grid-template-columns:repeat(2, minmax(0,1fr))}
  .grid.grades{grid-template-columns:repeat(2, minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<canvas id="confetti" hidden></canvas>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brandHome" aria-label="الصفحة الرئيسية">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      </span>
      <span>
        <h1>نجوم الإنجليزي</h1>
        <p>من الأول الابتدائي إلى الثالث الثانوي · المنهج السعودي</p>
      </span>
    </button>
    <div class="total" title="مجموع النجوم"><span class="star">★</span><span id="totalStars">0</span><span>نجمة</span></div>
  </header>
  <main id="app"></main>
  <p class="foot" id="foot"></p>
</div>

<script>
const GRADES = [];
function GRADE(g){ GRADES.push(g); }
</script>
<script src="data/g1.js"></script>
<script src="data/g2.js"></script>
<script src="data/g3.js"></script>
<script src="data/g4.js"></script>
<script src="data/g5.js"></script>
<script src="data/g6.js"></script>
<script src="data/g7.js"></script>
<script src="data/g8.js"></script>
<script src="data/g9.js"></script>
<script src="data/g10.js"></script>
<script src="data/g11.js"></script>
<script src="data/g12.js"></script>
<script src="app.js"></script>
</body>
</html>
